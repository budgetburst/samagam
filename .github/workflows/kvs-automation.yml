            -d '{"ref":"main","inputs":{"mode":"continuous-loop","duration_minutes":"340"}}' || \
          echo "Auto-dispatch cycle complete."

  # ====================================================================
  # STAGE 4 (Hours 17.0 - 22.6)
  # Automatically starts fresh VM when Stage 3 completes
  # ====================================================================
  worker-stage-4:
    name: Continuous Worker (Stage 4)
    needs: worker-stage-3
    if: always() && github.event.inputs.mode != 'single-pass'
    runs-on: ubuntu-latest
