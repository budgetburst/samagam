name: KVS Samagam Multi-Account Automation

on:
  # Automated schedule: keeps fresh runs constantly queued and running 24/7
  schedule:
    - cron: '*/30 * * * *'

  # Manual on-demand execution from GitHub "Actions" tab
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'continuous-loop'
        type: choice
        options:
          - 'continuous-loop'
          - 'single-pass'
      duration_minutes:
        description: 'Duration (in minutes) per stage (default: 340)'
        required: false
        default: '340'

permissions:
  contents: write
  actions: write

concurrency:
  group: kvs-samagam-workflow
  cancel-in-progress: false

jobs:
  # ====================================================================
  # STAGE 1 (Hours 0 - 5.6)
  # ====================================================================
  worker-stage-1:
    name: Continuous Worker (Stage 1)
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Restore browser session cache
        uses: actions/cache@v4
        with:
          path: .kvs_render_profile
          key: kvs-profile-${{ runner.os }}-${{ github.run_id }}-1
          restore-keys: |
            kvs-profile-${{ runner.os }}-${{ github.run_id }}-
            kvs-profile-${{ runner.os }}-

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Install Playwright & OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run KVS Automation
        env:
          KVS_LOGIN_IDS: ${{ secrets.KVS_LOGIN_IDS }}
          KVS_LOGIN_ID: ${{ secrets.KVS_LOGIN_ID }}
          KVS_UNIVERSAL_PASSWORD: ${{ secrets.KVS_UNIVERSAL_PASSWORD }}
          KVS_ALTERNATE_PASSWORD: ${{ secrets.KVS_ALTERNATE_PASSWORD }}
          CHECK_INTERVAL_MS: '300000'     # Verification cycle: exactly 5 minutes
          RELOGIN_INTERVAL_MS: '900000'   # Relogin cycle: exactly 15 minutes
          HEADLESS: 'false'
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_DURATION: ${{ github.event.inputs.duration_minutes }}
          SECRET_SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }}
          SECRET_SCHEDULE_DURATION: ${{ secrets.SCHEDULE_DURATION_MINUTES }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="${INPUT_MODE:-continuous-loop}"
            MAX_RUNTIME_MINUTES="${INPUT_DURATION:-340}"
          else
            MODE="${SECRET_SCHEDULE_MODE:-continuous-loop}"
            MAX_RUNTIME_MINUTES="${SECRET_SCHEDULE_DURATION:-340}"
          fi

          export MODE MAX_RUNTIME_MINUTES CHECK_INTERVAL_MS RELOGIN_INTERVAL_MS

          if [ "$MODE" = "continuous-loop" ]; then
            echo "🚀 Launching continuous automation worker (5m verification | 15m relogin | duration: ${MAX_RUNTIME_MINUTES}m)..."
            xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24 -ac" node index.js
          else
            echo "⚡ Launching single-pass verification & session relogin..."
            xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24 -ac" node action-runner.js
          fi

      - name: Auto-dispatch Next Workflow Run
        if: always() && github.event.inputs.mode != 'single-pass'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
        run: |
          echo "Attempting to auto-dispatch fresh workflow run..."
          gh workflow run kvs-automation.yml -r main -f mode=continuous-loop -f duration_minutes=340 || \
          curl -s -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/kvs-automation.yml/dispatches \
            -d '{"ref":"main","inputs":{"mode":"continuous-loop","duration_minutes":"340"}}' || \
          echo "Auto-dispatch cycle complete."

  # ====================================================================
  # STAGE 2 (Hours 5.6 - 11.3)
  # Automatically starts fresh VM when Stage 1 completes
  # ====================================================================
  worker-stage-2:
    name: Continuous Worker (Stage 2)
    needs: worker-stage-1
