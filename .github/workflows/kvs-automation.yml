          SECRET_SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }}
          SECRET_SCHEDULE_DURATION: ${{ secrets.SCHEDULE_DURATION_MINUTES }}
        run: |
          MODE="continuous-loop"
          MAX_RUNTIME_MINUTES="${INPUT_DURATION:-340}"
          export MODE MAX_RUNTIME_MINUTES CHECK_INTERVAL_MS RELOGIN_INTERVAL_MS
          echo "🚀 Launching continuous automation worker Stage 2 (duration: ${MAX_RUNTIME_MINUTES}m)..."
          xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24 -ac" node index.js

      - name: Auto-dispatch Next Workflow Run
        if: always() && github.event.inputs.mode != 'single-pass'
        env:
          GH_TOKEN: ${{ secrets.ACTIONS_PAT || secrets.GH_PAT || secrets.GITHUB_TOKEN }}
