name: KVS Samagam Portal Automation

on:
  # Automated schedule: runs every 30 minutes to maintain 24/7 continuous session
  # Each run executes 6x 5-minute verifications and 2x 15-minute relogins
  schedule:
    - cron: '*/30 * * * *'

  # Manual on-demand execution from GitHub "Actions" tab
  workflow_dispatch:
    inputs:
      mode:
        description: 'Execution Mode'
        required: true
        default: 'continuous-loop'
        type: choice
        options:
          - 'continuous-loop'
          - 'single-pass'
      duration_minutes:
        description: 'Duration (in minutes) for continuous loop (max 350)'
        required: false
        default: '350'

concurrency:
  group: kvs-samagam-workflow
  cancel-in-progress: false

jobs:
  run-automation:
    name: Run KVS Automation Worker
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Restore browser session cache
        uses: actions/cache@v4
        with:
          path: .kvs_render_profile
          key: kvs-profile-${{ runner.os }}-${{ github.run_id }}
          restore-keys: |
            kvs-profile-${{ runner.os }}-

      - name: Install Node dependencies
        run: npm ci || npm install

      - name: Install Playwright & OS dependencies
        run: npx playwright install --with-deps chromium

      - name: Run KVS Automation
        env:
          KVS_LOGIN_IDS: ${{ secrets.KVS_LOGIN_IDS || 'EP.45354,EP.50696,CS.136206' }}
          KVS_LOGIN_ID: ${{ secrets.KVS_LOGIN_ID || 'EP.45354' }}
          KVS_UNIVERSAL_PASSWORD: ${{ secrets.KVS_UNIVERSAL_PASSWORD || 'samagam' }}
          KVS_ALTERNATE_PASSWORD: ${{ secrets.KVS_ALTERNATE_PASSWORD }}
          CHECK_INTERVAL_MS: '300000'     # Verification cycle: exactly 5 minutes
          RELOGIN_INTERVAL_MS: '900000'   # Relogin cycle: exactly 15 minutes
          HEADLESS: 'false'
          EVENT_NAME: ${{ github.event_name }}
          INPUT_MODE: ${{ github.event.inputs.mode }}
          INPUT_DURATION: ${{ github.event.inputs.duration_minutes }}
          SECRET_SCHEDULE_MODE: ${{ secrets.SCHEDULE_MODE }}
          SECRET_SCHEDULE_DURATION: ${{ secrets.SCHEDULE_DURATION_MINUTES }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            MODE="${INPUT_MODE:-continuous-loop}"
            MAX_RUNTIME_MINUTES="${INPUT_DURATION:-350}"
          else
            # Automated 30-minute blocks (executing 5m verifications and 15m relogins non-stop)
            MODE="${SECRET_SCHEDULE_MODE:-continuous-loop}"
            MAX_RUNTIME_MINUTES="${SECRET_SCHEDULE_DURATION:-30}"
          fi

          export MODE MAX_RUNTIME_MINUTES CHECK_INTERVAL_MS RELOGIN_INTERVAL_MS

          if [ "$MODE" = "continuous-loop" ]; then
            echo "🚀 Launching continuous automation worker (5m verification | 15m relogin | duration: ${MAX_RUNTIME_MINUTES}m)..."
            xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24 -ac" node index.js
          else
            echo "⚡ Launching single-pass verification & session relogin..."
            xvfb-run --auto-servernum --server-args="-screen 0 1366x768x24 -ac" node action-runner.js
          fi
