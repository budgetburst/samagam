name: GitHub Keepalive Schedule

on:
  schedule:
    # Run daily to ensure GitHub never disables scheduled workflows on inactive repositories
    - cron: '0 0 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  keepalive:
    name: Repository Keepalive
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Keep repository active
        uses: gautamkrishnar/keepalive-workflow@v2
